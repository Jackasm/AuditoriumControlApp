# Специальная директория для хранения файлов Gradle
distributionBase=GRADLE_USER_HOME

# Путь к распределению Gradle относительно distributionBase
distributionPath=wrapper/dists

# Специальная директория для хранения ZIP-архивов Gradle
zipStoreBase=GRADLE_USER_HOME

# Путь к хранилищу ZIP-архивов Gradle относительно zipStoreBase
zipStorePath=wrapper/dists

# URL для загрузки Gradle. Укажите желаемую версию Gradle здесь.
distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-all.zip