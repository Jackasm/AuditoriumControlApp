name: Build and Release

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Права на создание релиза
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Build
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
    
    - name: Rename APK
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AuditoriumControl.apk
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: AuditoriumControl
        path: app/build/outputs/apk/debug/AuditoriumControl.apk
    
    - name: Create Release
      uses: softprops/action-gh-release@v1  # <-- ДРУГОЙ ЭКШН
      with:
        tag_name: build-${{ github.run_number }}
        name: AuditoriumControl Build ${{ github.run_number }}
        files: app/build/outputs/apk/debug/AuditoriumControl.apk
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
