name: Build AuditoriumControl

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Build
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
    
    - name: Rename APK
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AuditoriumControl.apk
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AuditoriumControl
        path: app/build/outputs/apk/debug/AuditoriumControl.apk
    
    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "app/build/outputs/apk/debug/AuditoriumControl.apk"
        tag: build-${{ github.run_number }}
        name: AuditoriumControl Build ${{ github.run_number }}
        body: |
          📱 AuditoriumControl APK
          📅 Собрано: $(date)
          🔢 Build: #${{ github.run_number }}
        token: ${{ secrets.GITHUB_TOKEN }}
        draft: false
        prerelease: true
