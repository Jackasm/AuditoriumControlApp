# Организационные настройки
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true

# Настройки JVM для Gradle
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.experimental.enableNewJdkImage=false

# Настройки для Android Gradle Plugin
android.useAndroidX=true
android.enableJetifier=true

# Настройки прокси (если требуется)
# Удалите или закомментируйте эти строки, если прокси не нужен


# Аутентификация для прокси (если требуется)
# systemProp.http.proxyUser=your_proxy_username
# systemProp.http.proxyPassword=your_proxy_password
# systemProp.https.proxyUser=your_proxy_username
# systemProp.https.proxyPassword=your_proxy_password

# Отключение SSL проверки (только для тестирования, не используйте в production)
# systemProp.gradle.ssl.noVerify=true

# Настройки локального репозитория Maven (опционально)
# maven.repo.local=/path/to/local/maven/repo

# Дополнительные параметры
kotlin.code.style=official
#android.injected.build.model.only.versioned=true