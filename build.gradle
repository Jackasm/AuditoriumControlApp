buildscript {

    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.0' // Версия плагина Gradle для Android


    }
}

plugins {
    id 'com.android.application' version '8.9.0' apply false
    id 'com.android.library' version '8.9.0' apply false
    id 'maven-publish'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release  // Публикует release-версию
                groupId = 'com.example'
                artifactId = 'your-library'
                version = '1.0.0'
            }
        }
        repositories {
            maven {
                name = "GitHubPackages"
                url = uri("https://maven.pkg.github.com/<ваш-username>/<ваш-репозиторий>")
                credentials {
                    username = System.getenv("GITHUB_ACTOR")
                    password = System.getenv("GITHUB_TOKEN")
                }
            }
        }
    }
}
task clean(type: Delete) {
    delete rootProject.buildDir
}










