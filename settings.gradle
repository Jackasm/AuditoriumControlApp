pluginManagement {
    repositories {
        gradlePluginPortal() // Репозиторий Gradle плагинов
        google() // Репозиторий Google
        mavenCentral() // Центральный Maven репозиторий
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS) // Отключение локальных репозиториев модулей
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'AuditoriumControlApp' // Имя корневого проекта
include ':app' // Включение модуля 'app' в проект